<body>
    <div id="root"></div>

    <script>
        const { useState, useMemo, useEffect, useRef } = React;
        const e = React.createElement;
        const toCamel = obj => Object.fromEntries(
            Object.entries(obj).map(([k, v]) => [
                k.replace(/_([a-z])/g, (_, c) => c.toUpperCase()), v
            ])
        );
        const toSnake = obj => Object.fromEntries(
            Object.entries(obj).map(([k, v]) => [
                k.replace(/([A-Z])/g, '_$1').toLowerCase(), v
            ])
        );

        // ─── Searchable Select (dropdown with inline search) ───────────────────
        function SearchableSelect({ value, onChange, options, placeholder, disabled }) {
            const [isOpen, setIsOpen] = useState(false);
            const [search, setSearch] = useState('');
            const ref = useRef(null);
            const selectedOption = options.find(o => o.value === value);

            useEffect(() => {
                if (!isOpen) setSearch(selectedOption ? selectedOption.label : '');
            }, [value, isOpen, selectedOption]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (ref.current && !ref.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const filteredOptions = useMemo(() => {
                if (!search || search === (selectedOption ? selectedOption.label : '')) return options;
                return options.filter(o => o.label.toLowerCase().includes(search.toLowerCase()));
            }, [options, search, selectedOption]);

            return e('div', { ref, style: { position: 'relative', width: '100%' } },
                e('div', { style: { display: 'flex', alignItems: 'center', position: 'relative' } },
                    e('input', {
                        value: search,
                        placeholder: placeholder || 'Search and select...',
                        disabled,
                        onChange: (x) => { setSearch(x.target.value); setIsOpen(true); },
                        onFocus: () => { setIsOpen(true); if (search === (selectedOption ? selectedOption.label : '')) setSearch(''); },
                        style: { width:'100%', padding:'10px 32px 10px 12px', borderRadius:'8px', border:'1px solid rgba(0,0,0,0.15)', fontSize:'13px', outline:'none', background: disabled ? '#f5f5f2' : '#fff' }
                    }),
                    e('i', { className:'ti ti-selector', style:{ position:'absolute', right:'10px', pointerEvents:'none', color:'#999', fontSize:'14px' } })
                ),
                isOpen && !disabled && e('div', {
                    style: { position:'absolute', top:'calc(100% + 4px)', left:0, right:0, background:'#fff', border:'1px solid rgba(0,0,0,0.15)', borderRadius:'8px', boxShadow:'0 4px 12px rgba(0,0,0,0.15)', maxHeight:'220px', overflowY:'auto', zIndex:1000, padding:'4px' }
                },
                    filteredOptions.length === 0
                        ? e('div', { style:{ padding:'8px 12px', color:'#999', fontSize:'12px', fontStyle:'italic' } }, 'No options found')
                        : filteredOptions.map(opt => e('div', {
                            key: opt.value,
                            onClick: () => { onChange(opt.value); setSearch(opt.label); setIsOpen(false); },
                            style: { padding:'8px 12px', fontSize:'13px', borderRadius:'6px', cursor:'pointer', background: opt.value === value ? '#F0F7FF' : 'transparent', color: opt.value === value ? '#185FA5' : '#1a1a1a', fontWeight: opt.value === value ? 600 : 400 },
                            onMouseEnter: (ev) => { ev.currentTarget.style.background = opt.value === value ? '#E0F0FF' : '#f5f5f2'; },
                            onMouseLeave: (ev) => { ev.currentTarget.style.background = opt.value === value ? '#F0F7FF' : 'transparent'; }
                        }, opt.label))
                )
            );
        }

        // ─── List Search Bar component ──────────────────────────────────────────
        function ListSearchBar({ value, onChange, placeholder, onClear, count, total }) {
            return e('div', { style:{ display:'flex', alignItems:'center', gap:'10px', marginBottom:'16px', flexWrap:'wrap' } },
                e('div', { className:'search-box' },
                    e('i', { className:'ti ti-search' }),
                    e('input', { value, onChange: x => onChange(x.target.value), placeholder: placeholder || 'Search...' })
                ),
                value && e('button', { className:'clear-btn', onClick: onClear },
                    e('i', { className:'ti ti-x', style:{ fontSize:'12px' } }), 'Clear'
                ),
                e('span', { className:'results-count' }, 
                    value ? `${count} of ${total} results` : `${total} record${total !== 1 ? 's' : ''}`
                )
            );
        }

        // ─── Number generators ──────────────────────────────────────────────────
        const generateNextGRNNumber = (existingGrns) => {
            if (!existingGrns || existingGrns.length === 0) return 'GRN-OCT-004';
            const lastGrn = existingGrns[existingGrns.length - 1];
            const lastNum = lastGrn.number;
            const match = lastNum.match(/^(GRN-[A-Z]{3,4}-)(\d+)$/);
            if (match) return match[1] + String(parseInt(match[2], 10) + 1).padStart(match[2].length, '0');
            const fb = lastNum.match(/(\d+)(?!.*\d)/);
            if (fb) return lastNum.substring(0, fb.index) + String(parseInt(fb[1], 10) + 1).padStart(fb[1].length, '0') + lastNum.substring(fb.index + fb[1].length);
            return 'GRN-OCT-004';
        };

        const generateNextGDNNumber = (existingGdns) => {
            if (!existingGdns || existingGdns.length === 0) return 'GDN-NOV-502';
            const lastGdn = existingGdns[existingGdns.length - 1];
            const lastNum = lastGdn.number;
            const match = lastNum.match(/^(GDN-[A-Z]{3,4}-)(\d+)$/);
            if (match) return match[1] + String(parseInt(match[2], 10) + 1).padStart(match[2].length, '0');
            const fb = lastNum.match(/(\d+)(?!.*\d)/);
            if (fb) return lastNum.substring(0, fb.index) + String(parseInt(fb[1], 10) + 1).padStart(fb[1].length, '0') + lastNum.substring(fb.index + fb[1].length);
            return 'GDN-NOV-502';
        };

        function buildBackupWorkbook(lpos, projects, calcStock, grns, grnItems, gdns, gdnItems) {
        const stockRows = [];
        lpos.forEach(l => {
            const prj = projects.find(p => p.id === l.projectId);
            calcStock(l.id).forEach(s => stockRows.push({
                'Project Name': prj?.name || 'N/A', 'Project Number': prj?.number || 'N/A',
                'LPO Number': l.number, 'Product Code': s.productCode, 'OEM Code': s.oemCode,
                'Description': s.description, 'Unit': s.unit, 'Received Quantity': s.received,
                'Delivered Quantity': s.delivered, 'Available Quantity': s.available
            }));
        });

        const grnRows = grnItems.map(it => {
            const grn = grns.find(g => g.id === it.grnId);
            const lpo = lpos.find(l => l.id === grn?.lpoId);
            const prj = projects.find(p => p.id === lpo?.projectId);
            return { 'GRN Number': grn?.number || 'N/A', 'Date': grn?.date || 'N/A', 'Project Number': prj?.number || 'N/A', 'LPO Number': lpo?.number || 'N/A', 'Product Code': it.productCode, 'OEM Code': it.oemCode, 'Description': it.description, 'Unit': it.unit, 'Qty': it.qty, 'Unit Price': it.unitPrice, 'Total Price': it.totalPrice };
        });

        const gdnRows = gdnItems.map(it => {
            const gdn = gdns.find(g => g.id === it.gdnId);
            const lpo = lpos.find(l => l.id === gdn?.lpoId);
            const prj = projects.find(p => p.id === lpo?.projectId);
            return { 'GDN Number': gdn?.number || 'N/A', 'Date': gdn?.date || 'N/A', 'Project Number': prj?.number || 'N/A', 'LPO Number': lpo?.number || 'N/A', 'Product Code': it.productCode, 'OEM Code': it.oemCode, 'Description': it.description, 'Unit': it.unit, 'Qty Delivered': it.qtyDelivered };
        });

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows), 'Stock Balance');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(grnRows), 'GRN Transactions');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gdnRows), 'GDN Transactions');
        return wb;
    }

        // ─── App ────────────────────────────────────────────────────────────────
        function App() {
            const [page, setPage] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [projects, setProjects] = useState([]);
            const [lpos, setLpos] = useState([]);
            const [grns, setGrns] = useState([]);
            const [grnItems, setGrnItems] = useState([]);
            const [gdns, setGdns] = useState([]);
            const [gdnItems, setGdnItems] = useState([]);
            const [loading, setLoading] = useState(false);
            const [session, setSession] = useState(null);
            const [authChecked, setAuthChecked] = useState(false);
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [emailModal, setEmailModal] = useState({ isOpen:false, recipient:'', subject:'', body:'', fileName:'', attachmentType:'' });
            useEffect(() => {
                db.auth.getSession().then(({ data }) => {
                    setSession(data.session);
                    setAuthChecked(true);
                });
                const { data: listener } = db.auth.onAuthStateChange((_event, sess) => {
                    setSession(sess);
                });
                return () => listener.subscription.unsubscribe();
            }, []);

            const handleLogin = async () => {
            setLoginError('');

            const { error } = await db.auth.signInWithPassword({
                email: loginEmail,
                password: loginPassword
            });

            if (error) {
                setLoginError(error.message);
            }
        };

        const handleLogout = async () => {
            await db.auth.signOut();
        };

        useEffect(() => {

            if (!session) return;

            async function loadAll() {
                setLoading(true);

                const [p, l, g, gi, d, di] = await Promise.all([
                    db.from('projects').select('*').order('created_at'),
                    db.from('lpos').select('*').order('created_at'),
                    db.from('grns')
                        .select('*')
                        .is('deleted_at', null)
                        .order('created_at'),
                    db.from('grn_items').select('*'),
                    db.from('gdns')
                        .select('*')
                        .is('deleted_at', null)
                        .order('created_at'),
                    db.from('gdn_items').select('*'),
                ]);

                setProjects((p.data || []).map(toCamel));
                setLpos((l.data || []).map(toCamel));
                setGrns((g.data || []).map(toCamel));
                setGrnItems((gi.data || []).map(toCamel));
                setGdns((d.data || []).map(toCamel));
                setGdnItems((di.data || []).map(toCamel));

                setLoading(false);

                // ADD AUTO-BACKUP CODE HERE
                const today = new Date();
                const isLastDay =
                    new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate() === today.getDate();

                if (isLastDay) {
                    const month = today.toISOString().slice(0, 7);

                    const { data: existing } = await db
                        .from('backups')
                        .select('id')
                        .eq('month', month)
                        .limit(1);

                    if (!existing || existing.length === 0) {

                        const projectsData = (p.data || []).map(toCamel);
                        const lposData = (l.data || []).map(toCamel);
                        const grnsData = (g.data || []).map(toCamel);
                        const grnItemsData = (gi.data || []).map(toCamel);
                        const gdnsData = (d.data || []).map(toCamel);
                        const gdnItemsData = (di.data || []).map(toCamel);

                        const tempCalcStock = (lpoId) => {
                            const lpoGrnIds = grnsData
                                .filter(g => g.lpoId === lpoId)
                                .map(g => g.id);

                            const lpoGdnIds = gdnsData
                                .filter(d => d.lpoId === lpoId)
                                .map(d => d.id);

                            const stock = {};

                            grnItemsData
                                .filter(i => lpoGrnIds.includes(i.grnId))
                                .forEach(i => {
                                    if (!stock[i.productCode]) {
                                        stock[i.productCode] = {
                                            ...i,
                                            received:0,
                                            delivered:0
                                        };
                                    }

                                    stock[i.productCode].received += i.qty;
                                });

                            gdnItemsData
                                .filter(i => lpoGdnIds.includes(i.gdnId))
                                .forEach(i => {
                                    if (stock[i.productCode]) {
                                        stock[i.productCode].delivered += i.qtyDelivered;
                                    }
                                });

                            return Object.values(stock).map(s => ({
                                ...s,
                                available:s.received - s.delivered
                            }));
                        };

                        const wb = buildBackupWorkbook(
                            lposData,
                            projectsData,
                            tempCalcStock,
                            grnsData,

        // ─── GDN Page ───────────────────────────────────────────────────────────
        function GDNPage({ projects, lpos, grns, gdns, setGdns, grnItems, gdnItems, setGdnItems, calcStock, triggerEmailModal }) {
            const [view, setView] = useState('list');
            const [selectedGdn, setSelectedGdn] = useState(null);
            const [editForm, setEditForm] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selProject, setSelProject] = useState('');
            const [selLpo, setSelLpo] = useState('');
            const [deliveries, setDeliveries] = useState({});
            const [form, setForm] = useState({ number:'', date:new Date().toISOString().split('T')[0], consigneeName:'', consigneeAddress:'' });

            const enrichedGdns = useMemo(() => gdns.map(d => {
                const lpo = lpos.find(l=>l.id===d.lpoId);
                const prj = projects.find(p=>p.id===lpo?.projectId);
                return { ...d, lpo, prj };
            }), [gdns, lpos, projects]);

            const filteredGdns = useMemo(() => {
                if (!searchQuery.trim()) return enrichedGdns;
                const q = searchQuery.toLowerCase();
                return enrichedGdns.filter(d =>
                    d.number.toLowerCase().includes(q) ||
                    d.date.includes(q) ||
                    (d.prj?.number||'').toLowerCase().includes(q) ||
                    (d.prj?.name||'').toLowerCase().includes(q) ||
                    (d.lpo?.number||'').toLowerCase().includes(q) ||
                    (d.lpo?.supplier||'').toLowerCase().includes(q) ||
                    (d.consigneeName||'').toLowerCase().includes(q) ||
                    (d.consigneeAddress||'').toLowerCase().includes(q)
                );
            }, [enrichedGdns, searchQuery]);

            const availLpos = selProject ? lpos.filter(l=>l.projectId===selProject) : [];

            const getProjectStock = (projectId) => {
                const projectLpos = lpos.filter(l=>l.projectId===projectId);
                const projectLpoIds = projectLpos.map(l=>l.id);
                const projectGrnIds = grns.filter(g=>projectLpoIds.includes(g.lpoId)).map(g=>g.id);
                const projectGdnIds = gdns.filter(d=>projectLpoIds.includes(d.lpoId)).map(d=>d.id);
                const pStock = {};
                grnItems.filter(i=>projectGrnIds.includes(i.grnId)).forEach(i=>{
                    if(!pStock[i.productCode]) pStock[i.productCode]={productCode:i.productCode,oemCode:i.oemCode,description:i.description,unit:i.unit,received:0,delivered:0};
                    pStock[i.productCode].received+=i.qty;
                });
                gdnItems.filter(i=>projectGdnIds.includes(i.gdnId)).forEach(i=>{
                    if(pStock[i.productCode]) pStock[i.productCode].delivered+=i.qtyDelivered;
                });
                return Object.values(pStock).map(s=>({...s,available:s.received-s.delivered}));
            };

            const stock = selLpo ? calcStock(selLpo) : (selProject ? getProjectStock(selProject) : []);

            const handleStartCreate = () => {
                setForm({ number:generateNextGDNNumber(gdns), date:new Date().toISOString().split('T')[0], consigneeName:'', consigneeAddress:'' });
                setSelProject(''); setSelLpo(''); setDeliveries({});
                setView('create');
            };

            const handleSendGdn = (gdn) => {
                const lpo = lpos.find(l=>l.id===gdn.lpoId);
                const prj = projects.find(p=>p.id===lpo?.projectId);
                const items = gdnItems.filter(i=>i.gdnId===gdn.id);
                const totalQty = items.reduce((s,i)=>s+i.qtyDelivered,0);
                triggerEmailModal(
                    `[InventoryPro] Goods Delivery Note - ${gdn.number}`,
                    `Hi Recipient,\n\nPlease find details for Goods Delivery Note ${gdn.number}:\n- Date: ${gdn.date}\n- Project Name: ${prj?.name||'N/A'}\n- Project Number: ${prj?.number||'N/A'}\n- Consignee Name: ${gdn.consigneeName||'N/A'}\n- Consignee Address: ${gdn.consigneeAddress||'N/A'}\n- Total Dispatched Quantity: ${totalQty}\n\nPlease check the attached PDF copy for itemized details.`,
                    `${gdn.number.toLowerCase()}_delivery.pdf`, 'pdf'
                );
            };
            const handleStartEditGdn = (gdn) => {
            const lpo = lpos.find(l => l.id === gdn.lpoId);
            const prj = projects.find(p => p.id === lpo?.projectId);
            const items = gdnItems.filter(i => i.gdnId === gdn.id);
            setEditForm({
                gdnId: gdn.id,
                gDate: gdn.date,
                consigneeName: gdn.consigneeName || '',
                consigneeAddress: gdn.consigneeAddress || '',
                prjId: prj?.id,
                lpoId: lpo?.id,
                lpoNumber: lpo?.number || '',
                prjNumber: prj?.number || '',
                items: items.map(i => ({
                    id: i.id,
                    productCode: i.productCode,
                    oemCode: i.oemCode || '',
                    description: i.description || '',
                    unit: i.unit || 'Pcs',
                    qtyDelivered: String(i.qtyDelivered)
                }))
            });
            setView('edit');
        };

            const getProductDetails = (productCode) => {
                const item = grnItems.find(i=>i.productCode===productCode);
                return { oemCode:item?.oemCode||'N/A', description:item?.description||'N/A', unit:item?.unit||'Pcs' };
            };

            return e('div', null,
                e('div', { className:'card' },
                    e('div', { className:'card-header' },
                        e('span', { className:'card-title' }, 'Delivery Log'),
                        view === 'list' && e('button', { className:'btn btn-primary', onClick:handleStartCreate }, e('i',{className:'ti ti-plus'}), 'Issue New GDN')
                    ),

                    // ── LIST VIEW ──
                    view === 'list' ? e('div', null,
                        e(ListSearchBar, {
                            value: searchQuery,
                            onChange: setSearchQuery,
                            placeholder: 'Search by GDN no., date, project no., consignee...',
                            onClear: () => setSearchQuery(''),
                            count: filteredGdns.length,
                            total: enrichedGdns.length
                        }),

        // ─── Stock Inquiry ──────────────────────────────────────────────────────
        function StockInquiry({ projects, lpos, calcStock }) {
            const [searchQuery, setSearchQuery] = useState('');
            const allStock = useMemo(() => {
                const results=[];
                lpos.forEach(l=>{
                    const prj=projects.find(p=>p.id===l.projectId);
                    calcStock(l.id).forEach(i=>results.push({...i,projectName:prj?.name||'N/A',projectNo:prj?.number||'N/A',lpoNo:l.number}));
                });
                return results;
            }, [projects,lpos,calcStock]);
            const filteredStock = useMemo(() => {
                if(!searchQuery) return allStock;
                const q=searchQuery.toLowerCase();
                return allStock.filter(s=>(s.projectName&&s.projectName.toLowerCase().includes(q))||(s.projectNo&&s.projectNo.toLowerCase().includes(q))||(s.lpoNo&&s.lpoNo.toLowerCase().includes(q))||(s.productCode&&s.productCode.toLowerCase().includes(q))||(s.oemCode&&s.oemCode.toLowerCase().includes(q)));
            }, [allStock,searchQuery]);
            return e('div',null,
                e('div',{className:'card'},
                    e('div',{className:'card-header',style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'12px',marginBottom:'16px'}},
                        e('span',{className:'card-title'},'Global Inventory Balance'),
                        e('div',{style:{position:'relative',width:'280px'}},
                            e('input',{value:searchQuery,placeholder:'Search name, number, code...',onChange:x=>setSearchQuery(x.target.value),style:{width:'100%',padding:'8px 12px 8px 32px',borderRadius:'8px',border:'1px solid rgba(0,0,0,0.15)',fontSize:'13px',outline:'none'}}),

                        )
                    ),
                    e('table',null,
                        e('thead',null,e('tr',null,
                            e('th',null,'Project Name'), e('th',null,'Project Number'), e('th',null,'LPO Number'),
                            e('th',null,'Product Code'), e('th',null,'OEM Code'), e('th',null,'Description'), e('th',null,'Unit'),
                            e('th',{style:{textAlign:'right'}},'Received Quantity'), e('th',{style:{textAlign:'right'}},'Delivered Quantity'), e('th',{style:{textAlign:'right'}},'Available Quantity')
                        )),
                        e('tbody',null, filteredStock.length===0
                            ? e('tr',null,e('td',{colSpan:10,style:{textAlign:'center',color:'#999',padding:'24px'}},'No matching stock records found.'))
                            : filteredStock.map((s,idx)=>e('tr',{key:idx},
                                e('td',null,s.projectName),
                                e('td',null,e('span',{className:'badge'},s.projectNo)),

                                e('td',null,e('span',{className:'badge badge-blue'},s.productCode)),

                            ))

        // ─── Reports ────────────────────────────────────────────────────────────
        function Reports({ projects, lpos, grns, gdns, grnItems, gdnItems, calcStock, triggerEmailModal }) {
            const [reportType, setReportType] = useState('project');
            const [projectSel, setProjectSel] = useState('');
            const [lpoSel, setLpoSel] = useState('');
            const [selection, setSelection] = useState('');
            const [oemInput, setOemInput] = useState('');

            const exportToExcel = (data, name) => {
                const ws=XLSX.utils.json_to_sheet(data);
                const wb=XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb,ws,"InventoryReport");
                XLSX.writeFile(wb,`${name}_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            const getProductDetails = (productCode) => {
                const item=grnItems.find(i=>i.productCode===productCode);
                return { oemCode:item?.oemCode||'N/A', description:item?.description||'N/A', unit:item?.unit||'Pcs' };
            };

            const reportData = useMemo(() => {
                const filteredLpos = projectSel ? lpos.filter(l=>l.projectId===projectSel) : [];
                const finalLpoIds = lpoSel ? [lpoSel] : filteredLpos.map(l=>l.id);
                switch(reportType){
                    case 'project':{
                        if(!projectSel) return [];
                        const prj=projects.find(p=>p.id===projectSel);
                        const rows=[];
                        lpos.filter(l=>finalLpoIds.includes(l.id)).forEach(l=>{
                            calcStock(l.id).forEach(s=>rows.push({'Project Name':prj.name,'Project Number':prj.number,'LPO Number':l.number,'Product Code':s.productCode,'OEM Code':s.oemCode,'Description':s.description,'Unit':s.unit,'Received Quantity':s.received,'Delivered Quantity':s.delivered,'Available Quantity':s.available}));
                        });
                        return rows;
                    }
                    case 'lpo':{
                        const lpo=lpos.find(l=>l.id===selection);
                        if(!lpo) return [];
                        const prj=projects.find(p=>p.id===lpo.projectId);

                                                e('tbody',null,[...items.map((it,idx)=>e('tr',{key:it.id||idx},e('td',null,idx+1),e('td',null,e('span',{className:'badge badge-blue'},it.productCode)),e('td',null,it.oemCode||'N/A'),e('td',null,it.description),e('td',null,it.unit),e('td',{style:{textAlign:'right'}},it.qty),e('td',{style:{textAlign:'right'}},'$'+it.unitPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})),e('td',{style:{textAlign:'right',fontWeight:600}},'$'+it.totalPrice.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})))),e('tr',{key:'tot',style:{background:'#f9f9f7'}},e('td',{colSpan:5,style:{fontWeight:700,textAlign:'right',padding:'16px 10px'}},'Grand Total:'),e('td',{style:{fontWeight:700,textAlign:'right',padding:'16px 10px'}},items.reduce((s,it)=>s+it.qty,0)),e('td',null),e('td',{style:{fontWeight:700,textAlign:'right',padding:'16px 10px',color:'#185FA5',fontSize:'15px'}},'$'+grandTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})))])
                                            )

                                                e('div',{className:'form-section-title'}, e('i',{className:'ti ti-building'}),'Project & Header Information'),

        function BackupPage({ projects, lpos, grns, grnItems, gdns, gdnItems, calcStock }) {
            const [backups, setBackups] = useState([]);
            const [loadingBackups, setLoadingBackups] = useState(true);

            useEffect(() => {
                async function load() {
                    const { data } = await db.from('backups').select('*').order('created_at', { ascending: false });
                    setBackups((data || []).map(toCamel));
                    setLoadingBackups(false);
                }
                load();
            }, []);

            const runBackup = async () => {
                const month = new Date().toISOString().slice(0, 7);
                const wb = buildBackupWorkbook(lpos, projects, calcStock, grns, grnItems, gdns, gdnItems);
                XLSX.writeFile(wb, `backup_${month}.xlsx`);
                const { data, error } = await db.from('backups').insert({ month }).select().single();
                if (!error) setBackups(prev => [toCamel(data), ...prev]);
            };

            const reDownload = () => {
                const wb = buildBackupWorkbook(lpos, projects, calcStock, grns, grnItems, gdns, gdnItems);
                XLSX.writeFile(wb, `backup_redownload_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            return e('div', null,
                e('div', { className:'card' },
                    e('div', { className:'card-header' },
                        e('span', { className:'card-title' }, 'Monthly Backup'),
                        e('button', { className:'btn btn-primary', onClick: runBackup }, e('i', { className:'ti ti-download' }), 'Backup Now')
                    ),
                    e('p', { style: { fontSize:'12px', color:'#666', marginBottom:'16px' } }, 'Exports Stock Balance, GRN Transactions, and GDN Transactions as a multi-sheet Excel file.')
                ),
                e('div', { className:'card' },
                    e('div', { className:'card-header' }, e('span', { className:'card-title' }, 'Backup History')),
                    loadingBackups ? e('p', { style:{ color:'#999', fontSize:'13px' } }, 'Loading...') :
                    e('table', null,
                        e('thead', null, e('tr', null,
                            e('th', null, 'Month'),
                            e('th', null, 'Backed Up On'),
                            e('th', { style:{ textAlign:'right' } }, 'Action')
                        )),
                        e('tbody', null,
                            backups.length === 0
                                ? e('tr', null, e('td', { colSpan:3, style:{ textAlign:'center', color:'#999', padding:'24px' } }, 'No backups yet.'))
                                : backups.map(b => e('tr', { key:b.id },
                                    e('td', null, b.month),
                                    e('td', null, new Date(b.createdAt).toLocaleString()),
                                    e('td', { style:{ textAlign:'right' } }, e('button', { className:'btn', onClick: reDownload }, 'Re-download'))
                                ))
                        )
                    )
                )
            );
        }

        ReactDOM.render(e(App), document.getElementById('root'));
    </script>
